plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'com.cleanroommc.cleanroomgradle'
    id 'net.kyori.blossom' version '2.2.0'
}

import com.cleanroommc.gradle.api.task.mc.RunMinecraft
import org.jetbrains.gradle.ext.Gradle

import java.nio.file.Files
import java.nio.file.StandardCopyOption

ext {
    //noinspection GroovyAssignabilityCheck
    access_transformer_locations = "${mod_id}_at.cfg"
}

version = mod_version
group = root_package

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    if (generate_sources_jar.toBoolean()) {
        withSourcesJar()
    }
    if (generate_javadocs_jar.toBoolean()) {
        withJavadocJar()
    }
}

configurations {
    contain
    implementation.extendsFrom(contain)
}

// Same exclusions as Cleanroom's own build; the published userdev metadata does not carry them to consumers.
configurations.configureEach {
    exclude group: 'com.ibm.icu', module: 'icu4j-core-mojang'
    // patchy ships its own io.netty.bootstrap.Bootstrap, which shadows Netty 4.2's and crashes on world load
    exclude group: 'com.mojang', module: 'patchy'
}

configurations.named('runtimeClasspath') {
    // LWJGL 2 is replaced by LWJGLY at runtime
    exclude group: 'org.lwjgl.lwjgl'
}

dependencies {
    // Registering the userdev dependency switches CleanroomGradle into userdev mode: Minecraft and the loader
    // are provided under MCP names, and runClient, runServer and reobfJar become available.
    implementation cleanroom.userdev(cleanroom_version) {
        if (use_access_transformer.toBoolean()) {
            accessTransformers.from("src/main/resources/${access_transformer_locations}")
        }
    }
    if (use_asset_mover.toBoolean()) {
        implementation "com.cleanroommc:assetmover:${asset_mover_version}"
    }
    if (enable_junit_testing.toBoolean()) {
        testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

apply from: 'gradle/scripts/dependencies.gradle'

cleanroom {
    runs {
        // Second client for testing multiplayer (e.g. roll sync over Open to LAN) next to runClient
        client2 {
            inherit = 'client'
            configure {
                username = 'Player2'
                workingDir = file('run/client2')
            }
        }
    }
}

tasks.withType(RunMinecraft).configureEach {
    username.convention(minecraft_username)
    // Dev runs have no Mojang account; without this runServer asks on stdin
    offline = true

    // Foundation's game classloader only loads a fixed set of packages itself (net.minecraft, com.cleanroommc., ...)
    // and hands everything else to the system classloader first. With the mod's classes on the JVM classpath, the
    // system loader would define them against its own copy of Forge (@SidedProxy then reads back as null). So the
    // run loads the mod like a player's install: the dev jar goes into <workingDir>/mods and the raw output is
    // taken off the JVM classpath.
    FileCollection mainOutput = sourceSets.main.output
    Provider<RegularFile> devJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    String devJarName = "${mod_id}-dev.jar"
    dependsOn(tasks.named('jar'))
    doFirst {
        Set<File> outputFiles = mainOutput.files
        classpath = classpath.filter { !outputFiles.contains(it) }
        File modsDir = new File(workingDir, 'mods')
        modsDir.mkdirs()
        Files.copy(devJar.get().asFile.toPath(), new File(modsDir, devJarName).toPath(), StandardCopyOption.REPLACE_EXISTING)
    }
    def extraArgs = extra_jvm_args
    if (extraArgs != null && !extraArgs.trim().isEmpty()) {
        jvmArgs(extraArgs.trim().split(/\s+/).toList())
    }
    if (enable_foundation_debug.toBoolean()) {
        systemProperty("foundation.dump", "true")
        systemProperty("foundation.verbose", "true")
    }
    if (is_coremod.toBoolean()) {
        systemProperty("fml.coreMods.load", coremod_plugin_class_name)
    }
}

processResources {
    rename '(.+_at.cfg)', 'META-INF/$1'
}

sourceSets {
    main {
        blossom {
            javaSources {
                property('mod_id', mod_id)
                property('mod_name', mod_name)
                property('mod_version', mod_version)
                property('package', java_package)
            }
            resources {
                property('mod_id', mod_id)
                property('mod_name', mod_name)
                property('mod_version', mod_version)
                property('mod_description', mod_description)
                property('mod_authors', mod_authors.toString().split(',').findAll { !it.isBlank() }.collect { "\"${it.strip()}\"" }.join(', '))
                property('mod_credits', mod_credits)
                property('mod_url', mod_url)
                property('mod_update_json', mod_update_json)
                property('mod_logo_path', mod_logo_path)
                property('mod_issue_tracker', mod_issue_tracker)
            }
        }
    }
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                '1. Build'(Gradle) {
                    taskNames = ["build"]
                }
                '2. Run Client'(Gradle) {
                    taskNames = ["runClient"]
                }
                '3. Run Server'(Gradle) {
                    taskNames = ["runServer"]
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = '-encoding utf8'
                    moduleJavacAdditionalOptions = [
                            (project.name + '.main'): tasks.compileJava.options.compilerArgs.collect { "\"${it}\"" }.join(' ')
                    ]
                }
            }
        }
    }
}

compileJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

// The jar keeps MCP names (dev jar); reobfJar renames it to SRG names for players.
jar {
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    FileCollection contained = configurations.contain
    into('/') {
        from contained
    }
    def attribute_map = [:]
    attribute_map['ModType'] = "CRL"
    if (is_coremod.toBoolean()) {
        attribute_map['FMLCorePlugin'] = coremod_plugin_class_name
        if (coremod_includes_mod.toBoolean()) {
            attribute_map['FMLCorePluginContainsFMLMod'] = true
        }
    }
    if (use_access_transformer.toBoolean()) {
        attribute_map['FMLAT'] = access_transformer_locations
    }
    manifest.attributes(attribute_map)
    // contain is resolved only when the jar is built; resolving it while configuring is rejected
    doFirst {
        if (!contained.isEmpty()) {
            manifest.attributes(['ContainedDeps': contained.collect { it.name }.join(' '), 'NonModDeps': true])
        }
    }
    finalizedBy(tasks.named('reobfJar'))
}

tasks.named('assemble') {
    dependsOn(tasks.named('reobfJar'))
}

compileTestJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    })
    if (show_testing_output.toBoolean()) {
        testLogging {
            showStandardStreams = true
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/extra.gradle'
