name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  release:
    uses: CleanroomMC/Conventions/.github/workflows/release.yml@1.4.4
    with:
      publish-maven: false
      # Set to true once curseforge_project_id or modrinth_project_id is in gradle.properties and the matching token secret exists
      publish-mods: false
    secrets: inherit
